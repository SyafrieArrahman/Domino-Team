<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domino 2v2 Gaple Kompetisi</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--felt:#14402f;--deep:#0a2019;--ivory:#f3ead4;--ink:#1b1a17;--brass:#c9a24b;--A:#5cc4b0;--B:#e2735c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--deep);color:var(--ivory);font:15px/1.4 'DM Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1100px;margin:0 auto}
.hud{display:flex;align-items:center;gap:10px;padding:10px 12px}
.tm{flex:1;min-width:0}.tm.B{text-align:right}
.tm b{font:800 15px 'Fraunces',serif;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.A b{color:var(--A)}.B b{color:var(--B)}
.bar{height:6px;border-radius:3px;background:#ffffff1f;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--c)}.B .bar i{margin-left:auto}
.A{--c:var(--A)}.B{--c:var(--B)}
.tm small{opacity:.75;font-size:12px}
.score{font:800 30px/1 'Fraunces',serif;text-align:center;min-width:92px}
.score small{display:block;font:400 11px 'DM Sans';opacity:.7;margin-top:2px}
.arena{display:grid;grid-template-columns:clamp(58px,12vw,100px) 1fr clamp(58px,12vw,100px);grid-template-rows:auto 1fr;grid-template-areas:"t t t" "l f r";gap:6px;padding:0 8px;min-height:0}
.sT{grid-area:t;justify-self:center;flex-direction:row!important;gap:10px!important}.s1{grid-area:l;align-self:center}.s3{grid-area:r;align-self:center}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:0;max-width:100%}
.av{--p:100;width:46px;height:46px;border-radius:50%;padding:3px;background:conic-gradient(var(--c) calc(var(--p)*1%),#ffffff26 0);display:grid;place-items:center;flex:none}
.av span{width:100%;height:100%;border-radius:50%;background:var(--deep);display:grid;place-items:center;font:800 18px 'Fraunces',serif;color:var(--c)}
.av.on{box-shadow:0 0 0 3px #0a2019,0 0 14px var(--c)}
.seat:not(.on) .av{background:#ffffff26}
.nm{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bks{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:56px}
.bk{width:7px;height:14px;border-radius:2px;background:#e8dcbd;opacity:.85}
.bub{position:absolute;top:-6px;right:-4px;font-size:26px;animation:pop .3s}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.felt{grid-area:f;position:relative;overflow:hidden;border-radius:46% / 38%;background:radial-gradient(ellipse at center,#1d5a42,var(--felt) 70%);border:6px solid #3a2a16;box-shadow:inset 0 0 40px #0008;min-height:200px}
.chain{position:absolute;left:50%;top:50%;width:0;height:0;transition:transform .35s}
.chain .t{position:absolute;transform:translate(-50%,-50%) rotate(var(--r))}
.info{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:12px;opacity:.85;pointer-events:none}
.msg{position:absolute;left:0;right:0;top:8%;text-align:center;font:700 14px 'Fraunces',serif;color:var(--brass)}
.t{display:flex;background:linear-gradient(#f7f0dc,#e6d9b8);border-radius:5px;box-shadow:0 2px 3px #0007;color:var(--ink)}
.t.v{flex-direction:column}
.t i{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:var(--h);height:var(--h);padding:12%;font-style:normal}
.t b{width:70%;height:70%;margin:auto;border-radius:50%;background:var(--ink)}
.t u{width:2px;background:#8a7b55;margin:6px 0}.t.v u{width:auto;height:2px;margin:0 6px}
.hand{display:flex;justify-content:center;gap:6px;padding:14px 10px 8px;overflow-x:auto;--h:min(34px,calc((100vw - 40px)/7 - 6px))}
.hb{background:none;border:0;padding:0;border-radius:6px;transition:transform .15s,opacity .15s;flex:none}
.hb.dim{opacity:.4}.hb.ok .t{outline:3px solid var(--brass);outline-offset:1px}
.hb.ok:hover,.hb.sel{transform:translateY(-12px)}
.acts{display:flex;align-items:center;gap:8px;padding:6px 12px 12px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--brass);color:var(--ink);border:0;border-radius:999px;padding:9px 18px;font-weight:600}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{background:#ffffff1a;color:var(--ivory)}
#emotes{margin-left:auto;display:flex;gap:6px}#emotes.cd button{opacity:.35}
#emotes button{background:#ffffff1a;border:0;border-radius:50%;width:40px;height:40px;font-size:20px}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:9;overflow:auto}
.card{background:#10291f;border:2px solid var(--brass);border-radius:16px;padding:22px;max-width:460px;width:100%}
.card h1,.card h2{font:800 34px/1.05 'Fraunces',serif;margin:0 0 6px;color:var(--brass)}
.card h2{font-size:24px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #ffffff1f;font-size:14px}
.row .tl{display:flex;gap:3px;--h:10px}
.card label{display:block;font-size:13px;margin:10px 0 3px;opacity:.85}
.card input,.card select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #ffffff33;background:#0a2019;color:var(--ivory);font:inherit}
.card textarea{background:#0a2019;color:var(--ivory);border:1px solid #ffffff33;border-radius:8px;padding:8px;font:11px monospace;word-break:break-all;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tA{color:var(--A)}.tB{color:var(--B)}
body.rot #app{position:fixed;top:0;left:0;width:100vh;width:100dvh;height:100vw;max-width:none;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);padding:6px calc(env(safe-area-inset-bottom,0px) + 10px) 6px calc(env(safe-area-inset-top,0px) + 10px)}
.phone #app{max-width:none}
.phone .hud{padding:4px 10px;gap:8px}.phone .tm b{font-size:13px}.phone .score{font-size:22px;min-width:76px}.phone .score small{display:none}.phone .bar{margin:2px 0}
.phone .arena{grid-template-columns:90px 1fr 90px;gap:2px 6px;padding:0 6px}
.phone .av{width:34px;height:34px}.phone .av span{font-size:14px}
.phone .felt{border-width:4px;border-radius:40% / 45%;min-height:0}
.phone .msg{top:auto;bottom:26%;font-size:13px}.phone .info{bottom:6%}
.phone .bot{display:flex;align-items:center;padding:0 6px 4px}
.phone .hand{--h:20px;flex:1;padding:8px 4px 4px;justify-content:flex-start}
.phone .hb.ok:hover,.phone .hb.sel{transform:translateY(-6px)}
.phone .acts{flex:none;padding:0;gap:6px;flex-wrap:nowrap}
.phone .btn{padding:7px 12px;font-size:13px}
.phone #emotes{margin-left:0}.phone #emotes button{width:32px;height:32px;font-size:16px}
.phone .card{padding:14px}.phone .card h1{font-size:26px}
.mb{background:#ffffff1a;border:0;border-radius:50%;width:34px;height:34px;flex:none;font-size:16px}
.bot .seat,.trk,.cnt{display:none}
.trk span{display:flex;align-items:center;gap:3px}
.trk i{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:15px;height:15px;padding:1px;background:#e8dcbd;border-radius:3px}
.trk b{background:var(--ink);border-radius:50%;margin:auto;width:70%;height:70%}
.land #app{max-width:none}
.land .arena{position:relative;display:block;padding:0;min-height:0}
.land .felt{position:absolute;inset:0;border-radius:34px;border-width:4px;min-height:0}
.land .seat{position:absolute;z-index:2}
.land .sT{top:2px;left:50%;transform:translateX(-50%);flex-direction:row!important;gap:8px!important}
.land .s1{left:10px;top:50%;transform:translateY(-50%)}
.land .s3{right:10px;top:50%;transform:translateY(-50%)}
.land .av{width:44px;height:44px}
.land .bks{display:none}
.land .cnt{display:grid;place-items:center;min-width:22px;height:28px;padding:0 4px;border-radius:4px;background:#b8402f;border:1px solid var(--ivory);font:800 13px 'Fraunces',serif}
.land .bot{display:grid;grid-template-columns:140px 1fr 150px;align-items:end;gap:6px;padding:0 10px 6px}
.land .bot .seat{display:flex;position:relative;flex-direction:row;gap:8px;align-self:end;justify-self:start}
.land .hw{min-width:0}
.land .hand{--h:var(--hh,30px);justify-content:center;padding:12px 4px 4px;flex:none}
.land .hb.ok:hover,.land .hb.sel{transform:translateY(-8px)}
.land .trk{display:flex;gap:10px;justify-content:center;font-size:12px;padding:3px 10px;background:#0006;border-radius:12px;width:max-content;margin:0 auto}
.land .acts{flex-wrap:wrap;justify-content:flex-end;align-content:end;gap:5px;padding:0}
.land #emotes{margin-left:0}
.land .msg{top:auto;bottom:22%;font-size:13px}.land .info{bottom:6%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const half=v=>`<i>${[...Array(9)].map((_,k)=>PIPS[v].includes(k)?'<b></b>':'<span></span>').join('')}</i>`;
const tile=(a,b,c='',st='')=>`<div class="t ${c}" style="${st}">${half(a)}<u></u>${half(b)}</div>`;
let G=null,cfg=null,OL=null,ME=0,LB=null;const MU={on:false};
function setup(){
 const c=cfg||{target:3,timer:15,teams:['Tim A','Tim B'],names:['Kamu','Lawan 1','Partner','Lawan 2']};
 $('#app').innerHTML=`<div class="modal"><div class="card"><h1>Domino 2v2</h1><p style="margin:0 0 6px;opacity:.8">Gaple kompetisi. Kamu duduk di kursi bawah, tiga kursi lain dimainkan bot.</p>
 <div class="g2"><div><label for="tg">Target ronde (first to)</label><input id="tg" type="number" min="1" max="20" value="${c.target}"></div>
 <div><label for="tm">Timer giliran</label><select id="tm">${[10,15,20,0].map(v=>`<option value="${v}" ${v==c.timer?'selected':''}>${v?v+' detik':'Tanpa timer'}</option>`).join('')}</select></div></div>
 <div class="g2"><div><label class="tA" for="ta">Nama Tim A</label><input id="ta" value="${esc(c.teams[0])}" maxlength="14"></div><div><label class="tB" for="tb">Nama Tim B</label><input id="tb" value="${esc(c.teams[1])}" maxlength="14"></div>
 <div><label for="p1">Player 1 (bawah)</label><input id="p1" value="${esc(c.names[0])}" maxlength="10"></div><div><label for="p2">Player 2 (kiri)</label><input id="p2" value="${esc(c.names[1])}" maxlength="10"></div>
 <div><label for="p3">Player 3 (atas, partner)</label><input id="p3" value="${esc(c.names[2])}" maxlength="10"></div><div><label for="p4">Player 4 (kanan)</label><input id="p4" value="${esc(c.names[3])}" maxlength="10"></div></div>
 <button class="btn" style="width:100%;margin-top:16px" onclick="start()">Main lawan bot</button>
 <div class="g2" style="margin-top:14px"><button class="btn ghost" onclick="hostCreate()">Buat room online</button><button class="btn ghost" onclick="joinScreen()">Gabung room</button></div>
 <p id="olmsg" style="font-size:13px;opacity:.8;margin:8px 0 0">Online tanpa akun: tukar kode lewat WhatsApp. Saat gabung, isi namamu di kolom Player 1.</p></div></div>`;
}
function readCfg(){
 const v=i=>$('#'+i).value.trim();
 return cfg={target:Math.max(1,Math.min(20,+v('tg')||3)),timer:+v('tm'),teams:[v('ta')||'Tim A',v('tb')||'Tim B'],names:[v('p1')||'P1',v('p2')||'P2',v('p3')||'P3',v('p4')||'P4']};
}
function start(){musicStart();readCfg();OL=null;ME=0;G={cfg,rounds:[0,0],tally:[0,0],emo:{},ecd:0,hu:[true,false,false,false]};newHand(null)}
function newHand(op){
 const d=[];for(let a=0;a<7;a++)for(let b=a;b<7;b++)d.push([a,b]);
 for(let i=27;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 G.hands=[0,1,2,3].map(s=>d.slice(s*7,s*7+7).sort((x,y)=>x[0]+x[1]-y[0]-y[1]));
 Object.assign(G,{center:null,L:null,R:null,la:[],ra:[],phase:'play',first:op===null,modal:null,msg:'',last:0});
 G.turn=op===null?G.hands.findIndex(h=>h.some(t=>t[0]==6&&t[1]==6)):op;
 startTurn();
}
function valid(s){const r=[];G.hands[s].forEach((t,i)=>{const sd=[];
 if(!G.center){if(!G.first||(t[0]==6&&t[1]==6))sd.push('C')}else{if(t.includes(G.L))sd.push('L');if(t.includes(G.R))sd.push('R')}
 if(sd.length)r.push({i,sd})});return r}
function startTurn(){
 clearTimeout(G.bt);G.sel=null;G.deadline=cfg.timer?Date.now()+cfg.timer*1000:0;render();bc();
 if(G.phase!=='play')return;const s=G.turn;
 if(!G.hu[s])G.bt=setTimeout(()=>bot(s),800+Math.random()*800);
 else if(!G.center&&G.first)G.bt=setTimeout(()=>doPlay(s,G.hands[s].findIndex(t=>t[0]==6&&t[1]==6),'C'),900);
 else if(!valid(s).length&&G.center){G.msg=cfg.names[s]+', tidak ada langkah. Tekan PASS.';render();bc()}
}
function doPlay(s,i,side){
 const t=G.hands[s].splice(i,1)[0];G.lastTile=t;G.msg='';G.sel=null;
 if(side==='C'){G.center=t;G.L=t[0];G.R=t[1]}
 else{const e=side==='L'?G.L:G.R,o=t[0]===e?t[1]:t[0];(side==='L'?G.la:G.ra).push([e,o]);if(side==='L')G.L=o;else G.R=o}
 G.last=s;
 if(!G.hands[s].length)return endHand('empty',s);
 if([0,1,2,3].every(x=>!valid(x).length))return endHand('dead',s);
 G.turn=(s+1)%4;startTurn();
}
function pass(s){if(G.phase!=='play'||valid(s).length)return;G.turn=(s+1)%4;G.msg=cfg.names[s]+' pass';startTurn()}
function bot(s){
 if(G.phase!=='play'||G.turn!==s)return;const v=valid(s);
 if(Math.random()<.06)emote(['👍','😅','😂'][Math.random()*3|0],s);
 if(!v.length)return pass(s);
 const sc=o=>{const t=G.hands[s][o.i];return t[0]+t[1]+(t[0]===t[1]?3:0)+Math.random()*2};
 v.sort((a,b)=>sc(b)-sc(a));const m=v[0];doPlay(s,m.i,m.sd[Math.random()*m.sd.length|0]);
}
function tap(i){
 if(G.turn!==ME||G.phase!=='play')return;const o=valid(ME).find(x=>x.i===i);if(!o)return;
 if(o.sd.length===1)act(i,o.sd[0]);else{G.sel=i;render()}
}
function side(sd){if(G.sel!==null){const i=G.sel;G.sel=null;act(i,sd)}}
const isClient=()=>OL&&OL.role==='client';
function act(i,sd){if(isClient()){OL.room.emit('act',{a:'p',i,t:G.hands[ME][i],sd});render()}else doPlay(ME,i,sd)}
function passMe(){if(isClient())OL.room.emit('act',{a:'x'});else pass(ME)}
function emote(e,s=ME){if(s===ME){if(Date.now()<G.ecd)return;G.ecd=Date.now()+8000}if(OL)OL.room.emit('em',{s,e});else showEm(s,e)}
function showEm(s,e){G.emo[s]={e,t:Date.now()};render();setTimeout(render,2600)}
function endHand(kind,s){
 G.phase='over';clearTimeout(G.bt);let name,pts,team,op=s;
 const sum=x=>G.hands[x].reduce((a,t)=>a+t[0]+t[1],0),ts=[sum(0)+sum(2),sum(1)+sum(3)];
 if(kind==='empty'){team=s%2;const l=G.lastTile;if(l[0]===l[1]){name='APOLLO';pts=4}else if(G.L===G.R){name='CEKI';pts=2}else{name='DOMI';pts=1}}
 else{const m=s%2;if(ts[m]<ts[1-m]){name='KANDANG';pts=2;team=m}else{name='TANGKAP KANDANG';pts=3;team=1-m;op=(s+1)%4}}
 G.tally[team]+=pts;const pre=[...G.tally];let rw=false,champ=false;
 if(G.tally[team]>=10){G.rounds[team]++;G.tally=[0,0];rw=true;if(G.rounds[team]>=cfg.target)champ=true}
 G.opener=op;G.modal={name,pts,team,kind,ts,rw,champ,s,pre};G.cd=5;render();bc();
 clearInterval(G.ci);if(!champ)G.ci=setInterval(()=>{if(--G.cd<=0)nextHand();else{render();bc()}},1000);
}
function nextHand(){if(isClient())return;clearInterval(G.ci);newHand(G.opener)}
function layout(){
 const pos=[];if(!G.center)return pos;const F=$('#felt'),wide=!!F&&F.clientWidth>F.clientHeight*1.5;
 pos.push({x:0,y:0,ang:0,a:G.center[0],b:G.center[1]});
 const arm=(list,d0,perp)=>{
  const nd=[-d0[0],-d0[1]],dirs=[d0,perp,nd,perp,d0,perp,nd,perp],lens=wide?[7,2,7,2,7,2,7,2]:[6,3,6,3,6,3,6,3];
  let p=[d0[0],d0[1]],seg=0,cnt=0;
  list.forEach(([a,b])=>{
   if(cnt>=lens[seg]){seg++;cnt=0}
   const d=dirs[seg];let c;
   if(cnt===0&&seg>0){const o=dirs[seg-1];c=[p[0]+o[0]*.5+d[0]*1.5,p[1]+o[1]*.5+d[1]*1.5];p=[p[0]+o[0]*.5+d[0]*2.5,p[1]+o[1]*.5+d[1]*2.5]}
   else{c=[p[0]+d[0],p[1]+d[1]];p=[p[0]+d[0]*2,p[1]+d[1]*2]}
   cnt++;pos.push({x:c[0],y:c[1],ang:Math.atan2(d[1],d[0])*180/Math.PI,a,b});
  });
 };
 arm(G.ra,[1,0],[0,1]);arm(G.la,[-1,0],[0,-1]);return pos;
}
function trk(){const on=G.center?[G.center,...G.la,...G.ra]:[],c=n=>7-on.filter(t=>t.includes(n)).length-G.hands[ME].filter(t=>t.includes(n)).length;return [0,1,2,3,4,5,6].map(n=>`<span>${half(n)}${c(n)}</span>`).join('')}
function seatEl(s,pc){
 const t=s%2,n=G.hands[s].length,on=G.turn===s&&G.phase==='play',e=G.emo[s];
 return `<div class="seat ${pc||''} ${on?'on':''}"><div class="av ${on?'on':''}" id="av${s}" style="--c:var(--${t?'B':'A'})"><span>${esc(cfg.names[s][0])}</span></div>
 <div style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0"><div class="nm">${esc(cfg.names[s])}</div>${s!==ME?`<div class="bks">${'<s class="bk"></s>'.repeat(n)}</div><b class="cnt">${n}</b>`:''}</div>
 ${e&&Date.now()-e.t<2500?`<div class="bub">${e.e}</div>`:''}</div>`;
}
function render(){
 if(!G)return setup();
 const T=cfg.teams,pct=i=>Math.min(100,G.tally[i]*10);
 const mine=G.turn===ME&&G.phase==='play',v=mine?valid(ME):[],cur=cfg.names[G.turn];
 let m='';
 if(G.modal){const M=G.modal,w=M.team;
  m=`<div class="modal"><div class="card"><h2 class="t${w?'B':'A'}">${esc(T[w])}</h2>
  ${M.champ?`<h1>JUARA MATCH</h1><p>${esc(T[w])} menang ${G.rounds[w]} ronde lebih dulu.</p>`:`<h1>${M.name} +${M.pts}</h1><p style="margin:4px 0 10px">${M.kind==='dead'?'Meja terkunci. ':''}Oleh ${esc(cfg.names[M.s])}.</p>`}
  ${[0,1,2,3].map(x=>`<div class="row"><span class="t${x%2?'B':'A'}">${esc(cfg.names[x])}</span><span class="tl">${G.hands[x].map(t=>tile(t[0],t[1],'v','--h:10px')).join('')||'habis'}</span><b>${G.hands[x].reduce((a,t)=>a+t[0]+t[1],0)} biji</b></div>`).join('')}
  <div class="row"><span>Total biji tim</span><span><span class="tA">${M.ts[0]}</span> lawan <span class="tB">${M.ts[1]}</span></span></div>
  <div class="row"><span>Poin kocokan</span><b><span class="tA">${M.pre[0]}</span> / 10 lawan <span class="tB">${M.pre[1]}</span> / 10</b></div>
  ${M.rw&&!M.champ?`<p style="color:var(--brass)">${esc(T[w])} dapat 1 skor ronde. Poin kedua tim kembali 0 – 0.</p>`:''}

function fit(){

 G={cfg,rounds:d.ro,tally:d.ta,emo:old.emo,ecd:old.ecd,center:d.ce,L:d.L,R:d.R,la:d.la,ra:d.ra,turn:d.tu,phase:d.ph,first:d.fi,msg:d.ms,hu:d.hu,sel:old.turn===d.tu?old.sel:null,hands:d.cn.map((n,s)=>hs?hs[s]:s===ME?(OL.mh||[]):Array(n).fill([0,0])),modal:d.mo||null,cd:d.mo?d.mo.cd:0,deadline:d.dl?Date.now()+d.dl:0};

const mf=m=>440*2**((m-69)/12),CH=[[45,[57,60,64,67]],[38,[57,60,65,69]],[43,[55,59,62,65]],[36,[55,59,64,67]]],PE=[69,72,74,76,79,81];
function osc(ty,f,t,d,v,at,dst){const C=MU.ctx,x=C.createOscillator(),e=C.createGain();x.type=ty;x.frequency.setValueAtTime(f,t);e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(v,t+at);e.gain.exponentialRampToValueAtTime(.0001,t+d);x.connect(e);e.connect(dst||MU.g);x.start(t);x.stop(t+d+.05);return x}
function nz(t,d,v,ty,f){const C=MU.ctx,s=C.createBufferSource(),b=C.createBiquadFilter(),e=C.createGain();s.buffer=MU.nb;b.type=ty;b.frequency.value=f;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(b);b.connect(e);e.connect(MU.g);s.start(t);s.stop(t+d)}
function beat(n,t){
 const [b,c]=CH[(n>>3)%4],k=n%8,S=60/76/2;
 if(k===0)c.forEach(m=>osc('triangle',mf(m),t,S*7.5,.05,.5));

 if(k===0||k===4){const x=osc('sine',130,t,.3,.5,.005);x.frequency.exponentialRampToValueAtTime(42,t+.2)}
 if(k===2||k===6)nz(t,.18,.18,'bandpass',1800);
 nz(t+(k%2?S*.12:0),.05,.06,'highpass',7000);
 if(Math.random()<.45)osc('triangle',mf(PE[Math.random()*6|0]),t,.7,.1,.01,MU.dl)}

const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};

function mkNet(role){
 const hs={},ps=new Map(),N={role,myId:role==='host'?'H':null,pl:[],pend:{},n:0};
 const fire=(t,d,peer,me)=>(hs[t]||[]).forEach(f=>{try{f({topic:t,data:d,peer,isMe:!!me,sameTab:!!me,kind:'viewer',guest:false})}catch(e){}});
